<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meter QA Review</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d6e63'/><path d='M22 68l18-22 15 11 20-30' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>

:root{
  --ground:#eceff0; --surface:#ffffff; --surface-2:#f5f7f7; --surface-3:#e6ebeb;
  --ink:#121c1e; --ink-2:#3d4c4e; --muted:#6b7b7d;
  --line:#d6dddd; --line-strong:#b6c2c2;
  --accent:#0d6e63; --accent-ink:#ffffff; --accent-soft:#d9ebe8; --accent-hover:#0a564e;
  --ok:#2c7a51; --ok-soft:#dbeee3; --ok-line:#a9d3bd;
  --warn:#8f6209; --warn-soft:#f6ebd3; --warn-line:#e0c58a;
  --crit:#a52c39; --crit-soft:#f7dee0; --crit-line:#e4aeb4;
  --info:#1f5c8b; --info-soft:#dce8f2; --info-line:#a9c6dd;
  --slate:#5b6f72; --slate-soft:#e3e9e9; --slate-line:#c2cfcf;
  --shadow-1:0 1px 2px rgba(18,28,30,.07);
  --shadow-2:0 2px 4px rgba(18,28,30,.06),0 12px 28px -14px rgba(18,28,30,.28);
  --shadow-3:0 4px 8px rgba(18,28,30,.08),0 28px 60px -20px rgba(18,28,30,.4);
  --r:7px; --r-lg:11px;
  --rail:236px;
  --sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --ground:#0c1413; --surface:#141d1d; --surface-2:#1a2424; --surface-3:#243030;
  --ink:#e3ebe9; --ink-2:#b2c1be; --muted:#829391;
  --line:#283534; --line-strong:#3a4948;
  --accent:#3fb3a2; --accent-ink:#052220; --accent-soft:#16403a; --accent-hover:#57c8b7;
  --ok:#57b287; --ok-soft:#153426; --ok-line:#2a5c44;
  --warn:#d3a244; --warn-soft:#352913; --warn-line:#5e4a1e;
  --crit:#e2757f; --crit-soft:#3a1a1e; --crit-line:#632f36;
  --info:#69a9d9; --info-soft:#122839; --info-line:#26455f;
  --slate:#8fa2a3; --slate-soft:#1f2b2b; --slate-line:#354443;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
  --shadow-3:0 4px 8px rgba(0,0,0,.4),0 28px 60px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0c1413; --surface:#141d1d; --surface-2:#1a2424; --surface-3:#243030;
  --ink:#e3ebe9; --ink-2:#b2c1be; --muted:#829391;
  --line:#283534; --line-strong:#3a4948;
  --accent:#3fb3a2; --accent-ink:#052220; --accent-soft:#16403a; --accent-hover:#57c8b7;
  --ok:#57b287; --ok-soft:#153426; --ok-line:#2a5c44;
  --warn:#d3a244; --warn-soft:#352913; --warn-line:#5e4a1e;
  --crit:#e2757f; --crit-soft:#3a1a1e; --crit-line:#632f36;
  --info:#69a9d9; --info-soft:#122839; --info-line:#26455f;
  --slate:#8fa2a3; --slate-soft:#1f2b2b; --slate-line:#354443;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.3),0 12px 28px -14px rgba(0,0,0,.8);
  --shadow-3:0 4px 8px rgba(0,0,0,.4),0 28px 60px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
#rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{display:flex;align-items:center;gap:9px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-mark svg{width:15px;height:15px}
.brand-name{font-weight:600;font-size:13.5px;letter-spacing:-.01em;line-height:1.15}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:.03em}
.rail-scroll{flex:1;overflow-y:auto;padding:10px 8px 16px}
.rail-group+.rail-group{margin-top:16px}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px;gap:6px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border:0;background:none;border-radius:var(--r);color:var(--ink-2);text-align:left;font-size:13.5px;font-weight:500}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item svg{width:16px;height:16px;flex:none;opacity:.85}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-3);padding:1px 5px;border-radius:20px}
.nav-item[aria-current="true"] .nav-count{background:var(--surface);color:var(--accent)}
.acct-item{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border:0;background:none;border-radius:var(--r);text-align:left;color:var(--ink-2);font-size:13px}
.acct-item:hover{background:var(--surface-2);color:var(--ink)}
.acct-item[aria-current="true"]{background:var(--surface-3);color:var(--ink);font-weight:600}
.acct-code{font-family:var(--mono);font-size:10.5px;color:var(--muted);flex:none;width:34px}
.acct-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-dot{margin-left:auto;width:6px;height:6px;border-radius:50%;flex:none}
.rail-foot{border-top:1px solid var(--line);padding:9px 10px;display:flex;align-items:center;gap:8px}
.rail-foot .who{min-width:0;flex:1}
.rail-foot .who-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail-foot .who-role{font-size:10.5px;color:var(--muted)}

/* ---------- main ---------- */
#main{min-width:0;display:flex;flex-direction:column}
#topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 18px;flex-wrap:wrap}
.view-title{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:0;line-height:1.2}
.view-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.topbar-spacer{flex:1;min-width:8px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:0 8px;min-width:150px}
.search svg{width:14px;height:14px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;padding:6px 0;width:100%;font-size:13px}
.kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:var(--r);font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:14px;height:14px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{color:var(--crit);border-color:var(--crit-line)}
.btn-danger:hover{background:var(--crit-soft)}
.btn-sm{padding:3px 7px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r);border:1px solid transparent;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px}

#viewport{flex:1;padding:16px 18px 64px;min-width:0}
.pane{display:none}
.pane.on{display:block}

/* ---------- toolbar / filters ---------- */
.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:2px;gap:2px}
.seg button{border:0;background:none;padding:3px 9px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-weight:600}
.field{display:inline-flex;align-items:center;gap:5px}
.field > label{font-size:11px;color:var(--muted);font-weight:500}
select.mini,input.mini{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 7px;font-size:12.5px;max-width:190px}
.chip-filter{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:3px 9px;font-size:12px;color:var(--ink-2)}
.chip-filter[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid;white-space:nowrap;line-height:1.5}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.s-open{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.s-prog{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.s-closed{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.p-urgent{color:var(--crit);background:var(--crit-soft);border-color:var(--crit-line)}
.p-high{color:#a8500f;background:#f8e6d6;border-color:#e9bf99}
.p-medium{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.p-low{color:var(--slate);background:var(--slate-soft);border-color:var(--slate-line)}
:root:not([data-theme="light"]) .p-high{color:#e39a63;background:#3a2314;border-color:#66401f}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .p-high{color:#a8500f;background:#f8e6d6;border-color:#e9bf99}}
:root[data-theme="dark"] .p-high{color:#e39a63;background:#3a2314;border-color:#66401f}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.cat .bar{width:3px;height:12px;border-radius:2px;flex:none}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;background:var(--surface-3);color:var(--ink-2);border:1px solid var(--line)}
.avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;flex:none;letter-spacing:.02em}
.avatar.lg{width:30px;height:30px;font-size:12px}
.avatar.xs{width:18px;height:18px;font-size:9px}
.avatar.none{background:var(--surface-3)!important;color:var(--muted);border:1px dashed var(--line-strong)}
.overdue{color:var(--crit);font-weight:600}
.duesoon{color:var(--warn);font-weight:600}
.carry{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit-line)}

/* ---------- cards / tiles ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.card-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.card-body{padding:14px}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 13px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.tile .l{font-size:11.5px;color:var(--muted);font-weight:500}
.tile .d{font-size:11px;margin-top:3px;color:var(--muted)}
.tile.accent{border-left:3px solid var(--accent)}
.tile.crit .v{color:var(--crit)} .tile.warn .v{color:var(--warn)} .tile.ok .v{color:var(--ok)}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;align-items:start}
/* ---------- list view ---------- */
.lgroup{margin-bottom:4px}
.lgroup-head{display:flex;align-items:center;gap:8px;padding:8px 6px 6px;position:sticky;top:53px;background:var(--ground);z-index:5}
.lgroup-head .tw{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;color:var(--ink)}
.lgroup-head .caret{width:14px;height:14px;color:var(--muted);transition:transform .15s}
.lgroup.collapsed .caret{transform:rotate(-90deg)}
.lgroup-title{font-size:13px;font-weight:600;letter-spacing:-.01em}
.lgroup-n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.lgroup.collapsed .ltable,.lgroup.collapsed .ladd{display:none}
.ltable{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.ltable th{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.ltable td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ltable tr:last-child td{border-bottom:0}
.ltable tbody tr:hover{background:var(--surface-2)}
.ltable tbody tr.sel{background:var(--accent-soft)}
.ltable .c-ref{width:72px} .ltable .c-st{width:116px} .ltable .c-pr{width:96px}
.ltable .c-own{width:44px} .ltable .c-due{width:92px} .ltable .c-age{width:60px} .ltable .c-cat{width:150px}
.ltitle{display:flex;align-items:center;gap:7px;min-width:0}
.ltitle .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltitle .sub{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;display:grid;place-items:center;flex:none;padding:0;color:transparent}
.tick:hover{border-color:var(--ok);color:var(--ok)}
.tick[data-done="1"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:10px;height:10px}
.ladd{width:100%;text-align:left;border:1px dashed var(--line-strong);background:none;color:var(--muted);padding:6px 12px;border-radius:var(--r);font-size:12.5px;margin-top:5px}
.ladd:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.lscroll{overflow-x:auto}

/* ---------- board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:290px;gap:11px;overflow-x:auto;padding-bottom:12px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 170px)}
.col-head{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line)}
.col-head .t{font-size:12.5px;font-weight:600}
.col-head .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.col-head .stripe{width:3px;height:14px;border-radius:2px}
.col-body{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;min-height:56px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-1);cursor:grab;text-align:left;width:100%}
.kcard:hover{border-color:var(--line-strong)}
.kcard.dragging{opacity:.4}
.kcard .kt{font-size:13px;font-weight:500;line-height:1.35}
.kcard .krow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kcard .kmeta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}

/* ---------- my tasks ---------- */
.bucket{margin-bottom:16px}
.bucket-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.bucket-head h3{margin:0;font-size:13.5px;font-weight:600}
.bucket-head .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mrow{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:5px}
.mrow:hover{border-color:var(--line-strong)}
.mrow .t{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;border:0;background:none;padding:0}

/* ---------- calendar ---------- */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface-2);border-bottom:1px solid var(--line)}
.cal-dow div{padding:6px 8px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-cell{min-height:98px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.out{background:var(--surface-2)}
.cal-cell.today{background:var(--accent-soft)}
.cal-d{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500}
.cal-cell.today .cal-d{color:var(--accent);font-weight:700}
.cal-ev{display:flex;align-items:center;gap:4px;font-size:11px;padding:2px 5px;border-radius:4px;background:var(--surface-3);border-left:2px solid var(--slate);text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-ev:hover{background:var(--line)}
.cal-more{font-size:10.5px;color:var(--muted);text-align:left;border:0;background:none;padding:0 5px}

/* ---------- timeline ---------- */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tl-scroll{overflow-x:auto}
.tl-inner{min-width:760px}
.tl-head{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:2}
.tl-label{width:250px;flex:none;padding:7px 11px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line)}
.tl-months{flex:1;display:flex;position:relative}
.tl-month{flex:1;padding:7px 8px;font-size:11px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tl-row{display:flex;border-bottom:1px solid var(--line);align-items:center;min-height:34px}
.tl-row:hover{background:var(--surface-2)}
.tl-rlabel{width:250px;flex:none;padding:5px 11px;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;min-width:0}
.tl-rlabel .t{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:none;padding:0;text-align:left;color:inherit}
.tl-track{flex:1;position:relative;height:34px}
.tl-bar{position:absolute;top:9px;height:16px;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:10.5px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;border:0;min-width:16px}
.tl-today{position:absolute;top:0;bottom:0;width:1.5px;background:var(--crit);opacity:.65;z-index:1}
.tl-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}

/* ---------- weekly review ---------- */
.sess-list{display:flex;flex-direction:column;gap:8px}
.sess{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:11px 13px}
.sess.live{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sess .dt{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;flex:none;width:52px;border-right:1px solid var(--line);padding-right:11px}
.sess .dt b{display:block;font-size:19px;color:var(--ink);font-weight:600;line-height:1.1}
.sess .body{flex:1;min-width:0}
.sess .body .t{font-weight:600;font-size:13.5px}
.sess .body .m{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.agenda-acct{margin-bottom:14px}
.agenda-acct h4{margin:0 0 6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.wrow{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:5px;flex-wrap:wrap}
.wrow.done-c{border-left:3px solid var(--ok)}
.wrow.done-o{border-left:3px solid var(--warn)}
.wrow.done-d{border-left:3px solid var(--slate)}
.wrow .wt{flex:1;min-width:170px;border:0;background:none;text-align:left;padding:0;font-weight:500;color:inherit}
.wactions{display:flex;gap:4px;flex:none}
.wbtn{border:1px solid var(--line-strong);background:var(--surface);padding:3px 9px;border-radius:var(--r);font-size:12px;font-weight:500}
.wbtn[aria-pressed="true"][data-o="closed"]{background:var(--ok);border-color:var(--ok);color:#fff}
.wbtn[aria-pressed="true"][data-o="open"]{background:var(--warn);border-color:var(--warn);color:#fff}
.wbtn[aria-pressed="true"][data-o="deferred"]{background:var(--slate);border-color:var(--slate);color:#fff}
.summary-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px}
pre.email{font-family:var(--mono);font-size:11.5px;line-height:1.6;white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:340px;overflow:auto;margin:0}

/* ---------- drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(10,20,20,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .16s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:70;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-3)}
#drawer.on{transform:none}
.dw-head{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dw-body{flex:1;overflow-y:auto;padding:14px}
.dw-title{width:100%;border:1px solid transparent;background:none;font-size:17px;font-weight:600;letter-spacing:-.015em;padding:5px 7px;border-radius:var(--r);resize:none;line-height:1.3;font-family:inherit}
.dw-title:hover{border-color:var(--line)}
.dw-title:focus{border-color:var(--accent);background:var(--surface-2);outline:none}
.props{display:grid;grid-template-columns:104px 1fr;gap:7px 10px;align-items:center;margin:10px 0 16px}
.props > label{font-size:11.5px;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:5px;min-width:0}
.props select,.props input,.props textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:5px 7px;font-size:13px;font-family:inherit}
.props select:hover,.props input:hover{border-color:var(--line-strong)}
.dw-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dw-sec h4{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.notes{width:100%;min-height:74px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;font-family:inherit;font-size:13px;resize:vertical;line-height:1.55}
.sub{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line)}
.sub .st{flex:1;border:0;background:none;padding:2px 0;font-size:13px}
.sub.done .st{text-decoration:line-through;color:var(--muted)}
.cmt{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.cmt .cb{flex:1;min-width:0}
.cmt .ch{display:flex;align-items:baseline;gap:7px}
.cmt .cn{font-size:12.5px;font-weight:600}
.cmt .cd{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.cmt .ct{font-size:13px;margin-top:2px;white-space:pre-wrap;line-height:1.5;word-break:break-word}
.act{display:flex;gap:8px;font-size:11.5px;color:var(--muted);padding:4px 0;align-items:baseline}
.act .ad{font-family:var(--mono);font-size:10.5px;flex:none}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;background:rgba(10,20,20,.45);overflow-y:auto}
#modal.on{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:520px;box-shadow:var(--shadow-3);overflow:hidden}
.sheet.wide{max-width:760px}
.sheet-head{display:flex;align-items:center;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:14.5px;font-weight:600}
.sheet-body{padding:15px;max-height:66vh;overflow-y:auto}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:11px 15px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.form-grid .full{grid-column:1/-1}
.fl{display:flex;flex-direction:column;gap:3px}
.fl label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.fl input,.fl select,.fl textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:13.5px;font-family:inherit;width:100%}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.hint{font-size:11px;color:var(--muted)}

/* ---------- misc ---------- */
.empty{text-align:center;padding:44px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r-lg)}
.empty h3{margin:0 0 5px;font-size:14.5px;color:var(--ink);font-weight:600}
.empty p{margin:0 auto 12px;max-width:44ch;font-size:13px}
.banner{display:flex;align-items:center;gap:9px;padding:8px 13px;border-radius:var(--r);border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);font-size:12.5px;margin-bottom:12px;flex-wrap:wrap}
.banner.info{border-color:var(--info-line);background:var(--info-soft);color:var(--info)}
.banner .sp{flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);background:var(--ink);color:var(--ground);padding:8px 15px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;opacity:0;pointer-events:none;transition:all .2s;box-shadow:var(--shadow-2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.bar-row{display:grid;grid-template-columns:118px 1fr 38px;gap:9px;align-items:center;padding:3px 0;font-size:12px}
.bar-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.bar-track{height:16px;background:var(--surface-3);border-radius:3px;overflow:hidden;display:flex}
.bar-fill{height:100%}
.bar-row .val{font-family:var(--mono);font-size:11.5px;text-align:right;color:var(--muted)}
.legend{display:flex;gap:11px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
/* ---------- device health check ---------- */
.dh{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.dh-scroll{overflow-x:auto}
.dh-inner{min-width:780px}
.dh-head{display:flex;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:3}
.dh-head .dh-l,.dh-head .dh-r{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:block;padding-top:8px;padding-bottom:8px}
.dh-l{width:210px;flex:none;padding:6px 11px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column;justify-content:center}
.dh-r{width:168px;flex:none;padding:6px 11px;border-left:1px solid var(--line);display:flex;align-items:center;gap:8px;justify-content:space-between}
.dh-track{flex:1;position:relative;min-width:0;height:44px}
.dh-month{position:absolute;top:8px;font-size:11px;font-weight:600;color:var(--muted);padding-left:6px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.dh-group{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--surface-2);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-size:12.5px;font-weight:600}
.dh-lane{display:flex;border-bottom:1px solid var(--line);min-height:44px}
.dh-lane:last-child{border-bottom:0}
.dh-lane:hover{background:var(--surface-2)}
.dh-key{font-family:var(--mono);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dh-site{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.dh-gl{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.7}
.dh-now{position:absolute;top:0;bottom:0;width:1.5px;background:var(--crit);opacity:.5;z-index:1}
.dh-bar{position:absolute;top:14px;height:16px;border-radius:8px;border:0;min-width:16px;padding:0;z-index:2;
  display:flex;align-items:center;justify-content:flex-end;overflow:hidden}
.dh-bar:hover{outline:2px solid var(--ink);outline-offset:1px}
.dh-tick{display:grid;place-items:center;width:14px;height:14px;margin-right:1px;color:#fff;flex:none}
.dh-tick svg{width:9px;height:9px;stroke-width:3}
.dh-nums{display:flex;gap:8px;align-items:baseline;font-size:12px}
.h-good{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.h-watch{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.h-risk{color:var(--info);background:var(--info-soft);border-color:var(--info-line)}
.h-crit{color:var(--crit);background:var(--crit-soft);border-color:var(--crit-line)}
@media (max-width:760px){ .dh-l{width:150px} .dh-r{width:130px} }

/* ---------- setup page ---------- */
.admin-cols{display:grid;grid-template-columns:minmax(290px,.8fr) minmax(430px,1.35fr);gap:12px;align-items:start}
.admin-col{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:1040px){ .admin-cols{grid-template-columns:1fr} }
.tscroll{overflow-x:auto;overflow-y:hidden}
.tscroll.capped{max-height:320px;overflow-y:auto}
.cellsel{width:100%;max-width:none;background:none;border:1px solid transparent;border-radius:var(--r);padding:3px 5px;font-size:12.5px}
.cellsel:hover{border-color:var(--line);background:var(--surface)}
.cellsel:focus{border-color:var(--accent);background:var(--surface);outline:none}
.acct-table{min-width:410px}
.acct-table th:nth-child(1),.acct-table td:nth-child(1){width:52px}
.acct-table th:nth-child(3),.acct-table td:nth-child(3){width:160px}
.acct-table th:nth-child(4),.acct-table td:nth-child(4){width:52px;text-align:right}
.people-table{min-width:330px}
.people-table th:nth-child(2),.people-table td:nth-child(2){width:126px}
.people-table th:nth-child(3),.people-table td:nth-child(3){width:48px;text-align:right}
.people-table th:nth-child(4),.people-table td:nth-child(4){width:30px}
.reg-table{min-width:390px}
.reg-table th:nth-child(4),.reg-table td:nth-child(4){width:48px;text-align:right}
.owner-cell{display:flex;align-items:center;gap:6px;min-width:0}
.steps{margin:12px 0;padding-left:18px;line-height:1.85;max-width:70ch;font-size:12.5px;color:var(--muted)}
.steps strong{color:var(--ink)}
table.plain{width:100%;border-collapse:collapse;font-size:13px}
table.plain th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
table.plain td{padding:6px 8px;border-bottom:1px solid var(--line)}
table.plain tr:last-child td{border-bottom:0}
#railToggle{display:none}
.railbackdrop{display:none}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  #rail.on{transform:none}
  .railbackdrop.on{display:block;position:fixed;inset:0;background:rgba(10,20,20,.4);z-index:85}
  #railToggle{display:grid}
  #viewport{padding:14px 16px 64px}
  #topbar{padding:10px 16px}
  .props{grid-template-columns:1fr;gap:4px}
  .props > label{margin-top:6px}
  .form-grid{grid-template-columns:1fr}
  .cal-cell{min-height:70px}
  .search{order:9;width:100%;min-width:0}
}
/* ---------- sign in ---------- */
#gate{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:var(--ground);padding:24px 16px;overflow-y:auto}
#gate.on{display:grid}
.gate-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:28px 26px}
.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.gate-brand .brand-mark{width:32px;height:32px;border-radius:8px}
.gate-brand .brand-mark svg{width:18px;height:18px}
.gate-card h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.gate-card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.gate-card h2{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.gate-card p{margin:0 0 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
.gate-card label{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin-bottom:4px}
.gate-card input{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:9px 11px;font-size:14px;font-family:inherit}
.gate-card input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.gate-card .btn{width:100%;justify-content:center;padding:9px;margin-top:12px;font-size:14px}
.gate-note{font-size:11.5px;color:var(--muted);line-height:1.5;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.gate-msg{font-size:12.5px;padding:9px 11px;border-radius:var(--r);margin-top:12px;line-height:1.5}
.gate-msg.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.gate-msg.err{background:var(--crit-soft);color:var(--crit);border:1px solid var(--crit-line)}
#bootMsg{position:fixed;inset:0;display:grid;place-items:center;background:var(--ground);z-index:400;padding:24px;text-align:center;color:var(--muted);font-size:13px}
#bootMsg.hide{display:none}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.offline{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--crit);color:#fff;padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:500;z-index:210;display:none}
.offline.on{display:block}
</style>
</head>
<body>

<div id="bootMsg"><div><div class="spin"></div>Loading&hellip;</div></div>

<div id="gate">
  <div class="gate-card">
    <div class="gate-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-8"/><path d="M3 21h18"/></svg>
      </span>
      <span>
        <h1>Meter QA Review</h1>
        <span class="sub">Weekly data quality</span>
      </span>
    </div>
    <div id="gateBody"></div>
  </div>
</div>

<div class="railbackdrop" id="railBackdrop"></div>
<div id="app">
  <aside id="rail">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-8"/><path d="M3 21h18"/></svg>
      </span>
      <span>
        <span class="brand-name">Meter QA Review</span>
        <span class="brand-sub">Weekly data quality</span>
      </span>
    </div>
    <div class="rail-scroll">
      <div class="rail-group" id="navViews"></div>
      <div class="rail-group">
        <div class="rail-head">
          <span class="eyebrow">Accounts</span>
          <button class="icon-btn" id="acctFilterClear" title="Show all accounts" style="width:20px;height:20px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>

  <div id="main">
    <header id="topbar">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/></svg>
      </button>
      <button class="btn" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 21h16"/></svg>
        Excel

<script>
"use strict";
/* ============================================================
   Meter QA Review — weekly data-quality issue tracker
   Static page + Supabase. No server code.
   ============================================================ */

const CATEGORIES = [
  {id:"manual-reads", name:"Manual reads",  color:"#8f6209"},
  {id:"salesforce",   name:"Salesforce",    color:"#1f5c8b"},
  {id:"iot",          name:"IoT",           color:"#0d6e63"},
  {id:"missing-data", name:"Missing data",  color:"#a52c39"},
  {id:"unusual-trend",name:"Unusual trend", color:"#6c3d9e"}
];
const CAT = Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));

const STATUSES = [
  {id:"open",   name:"Open",        cls:"s-open",   color:"#8f6209"},
  {id:"prog",   name:"In progress", cls:"s-prog",   color:"#1f5c8b"},
  {id:"closed", name:"Closed",      cls:"s-closed", color:"#2c7a51"}
];
const ST = Object.fromEntries(STATUSES.map(s=>[s.id,s]));

const PRIORITIES = [
  {id:"urgent", name:"Urgent", cls:"p-urgent", rank:0, color:"#a52c39"},
  {id:"high",   name:"High",   cls:"p-high",   rank:1, color:"#a8500f"},
  {id:"medium", name:"Medium", cls:"p-medium", rank:2, color:"#8f6209"},
  {id:"low",    name:"Low",    cls:"p-low",    rank:3, color:"#5b6f72"}
];
const PR = Object.fromEntries(PRIORITIES.map(p=>[p.id,p]));

const RECURRENCE = [
  {id:"none", name:"Does not repeat"},
  {id:"weekly", name:"Weekly"},
  {id:"monthly", name:"Monthly"},
  {id:"quarterly", name:"Quarterly"}
];

const AVATAR_COLORS = ["#0d6e63","#1f5c8b","#a52c39","#6c3d9e","#8f6209","#2c7a51","#b1457b","#3c5a99"];

/* ---------- tiny helpers ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const uid = p => p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = ()=> new Date().toISOString().slice(0,10);
const iso = d => d.toISOString().slice(0,10);
function parseISO(s){ if(!s) return null; const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d; }
function fmtDate(s){ const d=parseISO(s); if(!d) return "—";
  return d.toLocaleDateString("en-IE",{day:"2-digit",month:"short"}); }
function fmtDateLong(s){ const d=parseISO(s); if(!d) return "—";
  return d.toLocaleDateString("en-IE",{day:"numeric",month:"long",year:"numeric"}); }
function fmtStamp(ms){ if(!ms) return ""; const d=new Date(ms);
  return d.toLocaleDateString("en-IE",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit"}); }
function daysBetween(a,b){ return Math.round((b-a)/86400000); }
function ageDays(issue){ return Math.max(0, daysBetween(new Date(issue.createdAt), new Date())); }
function weeksCarried(issue){ return Math.floor(ageDays(issue)/7); }
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function initials(name){ return String(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?"; }
function colorFor(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h%AVATAR_COLORS.length]; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2600); }
function sortByPriorityThenAge(a,b){ const d=PR[a.priority].rank-PR[b.priority].rank; return d||(a.createdAt-b.createdAt); }
/* ============================================================
   SUPABASE DATA LAYER

   The view code below works against one in-memory `state` object, exactly
   as it did before. Everything here is the adapter: it loads the tables
   once, maps snake_case rows onto the camelCase shapes the views expect,
   subscribes to realtime changes, and turns edits back into SQL writes.
   ============================================================ */
const state = { users:{}, accounts:{}, sites:{}, meters:{}, issues:{}, sessions:{} };

let sb = null;          // supabase client
let ME = null;          // row from app_users for the signed-in person
let AUTH_EMAIL = null;  // the address they signed in with

const Store = {
  ready: false,
  online: true,
  _subs: [],
  onChange(fn){ this._subs.push(fn); },
  _emit(){ this._subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); }
};

/* ---------- row mapping ---------- */
const ts = s => s ? new Date(s).getTime() : null;

const mapUser    = r => ({id:r.id, name:r.name, role:r.role, email:r.email, active:r.active});
const mapAccount = r => ({id:r.code, code:r.code, name:r.name, ownerId:r.owner_id});
const mapSite    = r => ({id:r.id, accountCode:r.account_code, name:r.name});
const mapDevice  = r => ({id:r.id, accountCode:r.account_code, siteId:r.site_id, ref:r.ref});

function mapIssue(r){
  const prev = state.issues[r.id];
  return {
    id:r.id, ref:r.ref, title:r.title, description:r.description||"",
    accountCode:r.account_code, siteId:r.site_id, meterId:r.device_id,
    category:r.category, priority:r.priority, status:r.status,
    reporterId:r.reporter_id, ownerId:r.owner_id,
    startDate:r.start_date, dueDate:r.due_date, recurrence:r.recurrence,
    tags:r.tags||[], subtasks:r.subtasks||[],
    createdAt:ts(r.created_at), closedAt:ts(r.closed_at),
    /* comments and activity live in their own tables; keep whatever we
       already loaded so a realtime issue update doesn't blank them */
    comments: prev ? prev.comments : [],
    activity: prev ? prev.activity : []
  };
}
function mapSession(r){
  const prev = state.sessions[r.id];
  return {
    id:r.id, date:r.session_date, title:r.title, status:r.status,
    notes:r.notes||"", createdAt:ts(r.created_at), completedAt:ts(r.completed_at),
    outcomes: prev ? prev.outcomes : {}
  };
}

function issuePatchToRow(p){
  const map = {
    title:"title", description:"description", accountCode:"account_code",
    siteId:"site_id", meterId:"device_id", category:"category", priority:"priority",
    status:"status", reporterId:"reporter_id", ownerId:"owner_id",
    startDate:"start_date", dueDate:"due_date", recurrence:"recurrence",
    tags:"tags", subtasks:"subtasks", closedAt:"closed_at"
  };
  const row = {};
  for(const k of Object.keys(p)){
    if(!(k in map)) continue;
    let v = p[k];
    if(k==="closedAt") v = v ? new Date(v).toISOString() : null;
    row[map[k]] = v;
  }
  return row;
}

/* ---------- error surface ---------- */
function dbError(e, what){
  console.error(what||"supabase", e);
  const msg = (e && (e.message||e.error_description)) || "";
  if(/JWT|token|expired/i.test(msg)){ toast("Your session expired. Sign in again."); return signOut(); }
  if(/row-level security|violates row-level/i.test(msg)){
    toast("You do not have permission for that."); return;
  }
  if(/Failed to fetch|NetworkError/i.test(msg)){ setOnline(false); return; }
  toast(what ? (what+" failed. "+msg) : ("Could not save. "+msg));
}
function setOnline(ok){
  Store.online = ok;
  $("#offline").classList.toggle("on", !ok);
}

/* ---------- initial load ---------- */
async function loadAll(){
  const q = async (table, mapper, bucket, key) => {
    const {data, error} = await sb.from(table).select("*");
    if(error){ dbError(error, "Loading "+table); return; }
    const out = {};
    (data||[]).forEach(r=>{ const o = mapper(r); out[key?r[key]:r.id] = o; });
    state[bucket] = out;
  };
  await Promise.all([
    q("app_users", mapUser,    "users"),
    q("accounts",  mapAccount, "accounts", "code"),
    q("sites",     mapSite,    "sites"),
    q("devices",   mapDevice,  "meters"),
    q("issues",    mapIssue,   "issues"),
    q("sessions",  mapSession, "sessions")
  ]);

  /* graft the child tables onto their parents */
  const [{data:comments}, {data:activity}, {data:outcomes}] = await Promise.all([
    sb.from("issue_comments").select("*").order("created_at",{ascending:true}),
    sb.from("issue_activity").select("*").order("created_at",{ascending:true}),
    sb.from("session_outcomes").select("*")
  ]);
  (comments||[]).forEach(applyComment);
  (activity||[]).forEach(applyActivity);
  (outcomes||[]).forEach(applyOutcome);

  Store.ready = true;
  setOnline(true);
  Store._emit();
}

function applyComment(r){
  const i = state.issues[r.issue_id]; if(!i) return;
  if(i.comments.some(c=>c.id===r.id)) return;
  i.comments.push({id:r.id, userId:r.author_id, text:r.body, at:ts(r.created_at)});
  i.comments.sort((a,b)=>a.at-b.at);
}
function applyActivity(r){
  const i = state.issues[r.issue_id]; if(!i) return;
  if(i.activity.some(a=>a.id===r.id)) return;
  i.activity.push({id:r.id, userId:r.actor_id, text:r.text, at:ts(r.created_at)});
  i.activity.sort((a,b)=>a.at-b.at);
}
function applyOutcome(r){
  const s = state.sessions[r.session_id]; if(!s) return;
  s.outcomes[r.issue_id] = {o:r.outcome, note:r.note||""};
}

/* ---------- realtime ---------- */
function subscribeAll(){
  const ch = sb.channel("qa-all");
  const on = (table, fn) => ch.on("postgres_changes", {event:"*", schema:"public", table}, fn);

  const simple = (bucket, mapper, key) => payload=>{
    const k = payload.eventType==="DELETE"
      ? (key ? payload.old[key] : payload.old.id)
      : (key ? payload.new[key] : payload.new.id);
    if(payload.eventType==="DELETE") delete state[bucket][k];
    else state[bucket][k] = mapper(payload.new);
    safeRender();
  };

  on("app_users", simple("users",   mapUser));
  on("accounts",  simple("accounts",mapAccount,"code"));
  on("sites",     simple("sites",   mapSite));
  on("devices",   simple("meters",  mapDevice));
  on("issues",    simple("issues",  mapIssue));
  on("sessions",  simple("sessions",mapSession));

  on("issue_comments", p=>{
    if(p.eventType==="DELETE"){
      const i = state.issues[p.old.issue_id];
      if(i) i.comments = i.comments.filter(c=>c.id!==p.old.id);
    } else applyComment(p.new);
    safeRender(); if(ui.openIssueId) renderDrawerIfIdle();
  });
  on("issue_activity", p=>{ if(p.eventType!=="DELETE") applyActivity(p.new); safeRender(); });
  on("session_outcomes", p=>{
    if(p.eventType==="DELETE"){
      const s = state.sessions[p.old.session_id];
      if(s) delete s.outcomes[p.old.issue_id];
    } else applyOutcome(p.new);
    safeRender();
  });

  ch.subscribe(status=>{
    if(status==="SUBSCRIBED") setOnline(true);
    if(status==="CHANNEL_ERROR"||status==="TIMED_OUT") setOnline(false);
  });
}
function renderDrawerIfIdle(){
  const a = document.activeElement;
  if(a && a.closest && a.closest("#drawer")) return;
  renderDrawer();
}

/* ============================================================
   AUTH
   ============================================================ */
function gate(html){ $("#gate").classList.add("on"); $("#gateBody").innerHTML = html; $("#bootMsg").classList.add("hide"); }
function ungate(){ $("#gate").classList.remove("on"); $("#bootMsg").classList.add("hide"); }

function signInScreen(msg){
  gate(
    '<h2>Sign in</h2>'+
    '<p>Enter your Savills email address and we&rsquo;ll send you a sign-in link. No password to remember.</p>'+
    '<label for="gateEmail">Work email</label>'+
    '<input id="gateEmail" type="email" autocomplete="email" inputmode="email" placeholder="name@savills.ie">'+
    '<button class="btn btn-primary" id="gateSend">Email me a sign-in link</button>'+
    (msg||"")+
    '<p class="gate-note">Only Savills addresses can open this workspace. '+
    'If you sign in with anything else you will get in, but every page will be empty &mdash; '+
    'access is enforced by the database, not the screen.</p>');
  setTimeout(()=>{ const el=$("#gateEmail"); if(el) el.focus(); }, 40);
}

async function sendMagicLink(){
  const email = ($("#gateEmail").value||"").trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    $("#gateSend").insertAdjacentHTML("afterend",
      '<div class="gate-msg err">That does not look like an email address.</div>');
    return;
  }
  const btn = $("#gateSend"); btn.disabled = true; btn.textContent = "Sending…";
  const {error} = await sb.auth.signInWithOtp({
    email, options:{ emailRedirectTo: window.location.href.split("#")[0] }
  });
  if(error){
    btn.disabled = false; btn.textContent = "Email me a sign-in link";
    gate($("#gateBody").innerHTML);
    signInScreen('<div class="gate-msg err">'+esc(error.message)+'</div>');
    return;
  }
  gate('<h2>Check your inbox</h2>'+
    '<p>We sent a sign-in link to <strong>'+esc(email)+'</strong>. Open it on this device and you are in.</p>'+
    '<p class="gate-note">Nothing arrived? Give it a minute, then look in Junk &mdash; automated mail from new senders often lands there the first time. '+
    '<button class="btn btn-sm" id="gateBack" style="width:auto;margin-top:10px">Try a different address</button></p>');
}

async function signOut(){
  try{ await sb.auth.signOut(); }catch(e){}
  location.reload();
}

/* Ensure the app_users row exists. The database trigger creates it on first
   sign-up; this covers the case where that has not landed yet. */
async function ensureProfile(user){
  let {data} = await sb.from("app_users").select("*").eq("id", user.id).maybeSingle();
  if(!data){
    const guess = (user.email||"").split("@")[0].replace(/[._]/g," ")
      .replace(/\b\w/g, c=>c.toUpperCase());
    const {data:ins, error} = await sb.from("app_users")
      .insert({id:user.id, email:user.email, name:guess||user.email, role:"member"})
      .select().maybeSingle();
    if(error){ return null; }
    data = ins;
  }
  return data ? mapUser(data) : null;
}

async function boot(){
  const cfg = window.QA_CONFIG||{};
  if(!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY ||
     /abcdefgh|YOUR-/.test(cfg.SUPABASE_URL+cfg.SUPABASE_ANON_KEY)){
    gate('<h2>Not configured yet</h2>'+
      '<p>This app needs its database details before it can run. Open <code>config.js</code> '+
      'and paste in the Project URL and anon key from your Supabase project.</p>'+
      '<p class="gate-note">Step 2 of <strong>SETUP.md</strong> walks through it.</p>');
    return;
  }
  sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true }
  });

  const {data:{session}} = await sb.auth.getSession();
  if(!session){ signInScreen(); return; }
  await start(session.user);

  sb.auth.onAuthStateChange((evt)=>{ if(evt==="SIGNED_OUT") location.reload(); });
}

async function start(user){
  AUTH_EMAIL = user.email;
  $("#bootMsg").classList.remove("hide");
  ME = await ensureProfile(user);
  if(!ME){
    gate('<h2>No access</h2>'+
      '<p>You are signed in as <strong>'+esc(user.email)+'</strong>, but that address is not on an '+
      'approved Savills domain, so this workspace has nothing to show you.</p>'+
      '<button class="btn" id="gateOut">Sign out</button>'+
      '<p class="gate-note">If you think this is wrong, ask whoever set the workspace up &mdash; '+
      'the approved domains are one line in the database.</p>');
    return;
  }
  await loadAll();
  if(!Object.keys(state.accounts).length){
    gate('<h2>Database is empty</h2>'+
      '<p>Signed in fine, but no accounts came back. That usually means <code>schema.sql</code> '+
      'has not been run yet, or it was run against a different project.</p>'+
      '<button class="btn" id="gateOut">Sign out</button>');
    return;
  }
  ungate();
  subscribeAll();
  setView("dashboard");
  Store._emit();
}

/* ============================================================
   DERIVED DATA
   ============================================================ */
const userName = id => (state.users[id] && state.users[id].name) || "Unassigned";
const acctName = code => (state.accounts[code] && state.accounts[code].name) || code || "—";
const siteName = id => (state.sites[id] && state.sites[id].name) || "";
const meterRef = id => (state.meters[id] && state.meters[id].ref) || "";

function allIssues(){ return Object.values(state.issues); }
function accountsSorted(){ return Object.values(state.accounts).sort((a,b)=>Number(a.code)-Number(b.code)); }
function usersSorted(){ return Object.values(state.users).sort((a,b)=>a.name.localeCompare(b.name)); }
function openIssues(){ return allIssues().filter(i=>i.status!=="closed"); }
function isAdmin(){ return !!(ME && ME.role==="admin"); }

function ownerFor(accountCode){
  const a = state.accounts[accountCode];
  return (a && a.ownerId && state.users[a.ownerId]) ? a.ownerId : (ME?ME.id:null);
}

function orphanCount(){
  const usedM = new Set(), usedS = new Set();
  allIssues().forEach(i=>{ if(i.meterId) usedM.add(i.meterId); if(i.siteId) usedS.add(i.siteId); });
  Object.values(state.meters).forEach(m=>{ if(usedM.has(m.id) && m.siteId) usedS.add(m.siteId); });
  return Object.values(state.meters).filter(m=>!usedM.has(m.id)).length +
         Object.values(state.sites).filter(s=>!usedS.has(s.id)).length;
}

function visibleIssues(){
  let list = allIssues();
  if(ui.account) list = list.filter(i=>i.accountCode===ui.account);
  if(ui.q){
    const q = ui.q.toLowerCase();
    list = list.filter(i=>{
      const hay = [i.ref,i.title,i.description,acctName(i.accountCode),i.accountCode,
                   siteName(i.siteId),meterRef(i.meterId),(i.tags||[]).join(" "),
                   CAT[i.category]?CAT[i.category].name:""].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }
  if(ui.cats.size) list = list.filter(i=>ui.cats.has(i.category));
  if(ui.mineOnly && ME) list = list.filter(i=>i.ownerId===ME.id||i.reporterId===ME.id);
  if(!ui.showClosed) list = list.filter(i=>i.status!=="closed");
  return list;
}

  return '<span class="avatar '+(cls||"")+'" style="background:'+colorFor(u.id)+'" title="'+esc(u.name)+'">'+esc(initials(u.name))+'</span>';
}
function statusPill(s){ const x=ST[s]||ST.open; return '<span class="pill '+x.cls+'"><span class="dot"></span>'+x.name+'</span>'; }
function prioPill(p){ const x=PR[p]||PR.medium; return '<span class="pill '+x.cls+'">'+x.name+'</span>'; }
function catChip(c){ const x=CAT[c]; if(!x) return ""; return '<span class="cat"><span class="bar" style="background:'+x.color+'"></span>'+x.name+'</span>'; }
function dueHTML(i){
  if(!i.dueDate) return '<span style="color:var(--muted)">—</span>';
  const d = parseISO(i.dueDate), t = new Date(); t.setHours(0,0,0,0);
  const diff = daysBetween(t,d);
  let cls = "";
  if(i.status!=="closed"){ if(diff<0) cls="overdue"; else if(diff<=2) cls="duesoon"; }
  return '<span class="num '+cls+'">'+fmtDate(i.dueDate)+'</span>';
}
function locationLine(i){
  const bits=[];
  if(i.siteId && state.sites[i.siteId]) bits.push(siteName(i.siteId));
  if(i.meterId && state.meters[i.meterId]) bits.push(meterRef(i.meterId));
  return bits.join(" · ");
}
/* ============================================================
   MUTATIONS — every one writes to Postgres and lets realtime bring
   the change back. Local state is updated optimistically first so the
   interface never feels like it is waiting on the network.
   ============================================================ */
async function logActivity(issueId, text){
  if(!text) return;
  const {data, error} = await sb.from("issue_activity")
    .insert({issue_id:issueId, actor_id:ME.id, text}).select().maybeSingle();
  if(error) return;              // an audit line failing must never block the edit
  if(data) applyActivity(data);
}

async function createIssue(data){
  const row = Object.assign({
    title:"Untitled issue", description:"", category:"missing-data",
    priority:"medium", status:"open", recurrence:"none",
    start_date: todayISO(), tags:[], subtasks:[],
    reporter_id: ME.id
  }, issuePatchToRow(data||{}));
  if(!row.owner_id) row.owner_id = ownerFor(row.account_code);

  const {data:ins, error} = await sb.from("issues").insert(row).select().maybeSingle();
  if(error){ dbError(error, "Raising the issue"); return null; }
  const issue = mapIssue(ins);
  state.issues[issue.id] = issue;
  Store._emit();
  await logActivity(issue.id, "raised the issue");
  return issue;
}

async function updateIssue(id, partial, activityText){
  const cur = state.issues[id]; if(!cur) return;
  state.issues[id] = Object.assign({}, cur, partial);   // optimistic
  Store._emit();
  const row = issuePatchToRow(partial);
  if(Object.keys(row).length){
    const {error} = await sb.from("issues").update(row).eq("id", id);
    if(error){ state.issues[id] = cur; Store._emit(); return dbError(error, "Saving the change"); }
  }
  if(activityText) await logActivity(id, activityText);
}

async function setStatus(id, status){
  const cur = state.issues[id]; if(!cur || cur.status===status) return;
  await updateIssue(id, {status, closedAt: status==="closed" ? Date.now() : null},
                    "moved to "+ST[status].name);
  if(status==="closed" && cur.recurrence && cur.recurrence!=="none") await spawnRecurrence(cur);
}

async function spawnRecurrence(src){
  const step = {weekly:7, monthly:30, quarterly:91}[src.recurrence] || 0;
  if(!step) return;
  const shift = d => d ? iso(addDays(parseISO(d), step)) : null;
  const next = await createIssue({
    title:src.title, description:src.description, accountCode:src.accountCode,
    siteId:src.siteId, meterId:src.meterId, category:src.category,
    priority:src.priority, ownerId:src.ownerId,
    startDate: shift(src.startDate) || todayISO(), dueDate: shift(src.dueDate),
    recurrence:src.recurrence, tags:(src.tags||[]).slice(),
    subtasks:(src.subtasks||[]).map(s=>({id:uid("s"), text:s.text, done:false}))
  });
  if(next) toast("Recurring check "+next.ref+" scheduled");
}

async function deleteIssue(id){
  const {error} = await sb.from("issues").delete().eq("id", id);
  if(error) return dbError(error, "Deleting the issue");
  delete state.issues[id]; Store._emit();
}

async function addComment(issueId, text){
  const {data, error} = await sb.from("issue_comments")
    .insert({issue_id:issueId, author_id:ME.id, body:text}).select().maybeSingle();
  if(error) return dbError(error, "Posting the comment");
  if(data) applyComment(data);
  Store._emit();
}

/* sites and devices are created on demand from whatever people type */
async function resolveSite(accountCode, name){
  const n = String(name||"").trim(); if(!n || !accountCode) return null;
  const found = Object.values(state.sites).find(
    s=>s.accountCode===accountCode && s.name.toLowerCase()===n.toLowerCase());
  if(found) return found.id;
  const {data, error} = await sb.from("sites")
    .insert({account_code:accountCode, name:n}).select().maybeSingle();
  if(error){
    /* someone else created it a moment ago — take theirs */
    const {data:again} = await sb.from("sites").select("*")
      .eq("account_code",accountCode).ilike("name",n).maybeSingle();
    if(again){ state.sites[again.id]=mapSite(again); return again.id; }
    dbError(error, "Adding the site"); return null;
  }
  state.sites[data.id] = mapSite(data); Store._emit();
  return data.id;
}

async function resolveMeter(accountCode, siteId, ref){
  const r = String(ref||"").trim(); if(!r || !accountCode) return null;
  const found = Object.values(state.meters).find(
    m=>m.accountCode===accountCode && m.ref.toLowerCase()===r.toLowerCase());
  if(found) return found.id;
  const {data, error} = await sb.from("devices")
    .insert({account_code:accountCode, site_id:siteId||null, ref:r}).select().maybeSingle();
  if(error){
    const {data:again} = await sb.from("devices").select("*")
      .eq("account_code",accountCode).ilike("ref",r).maybeSingle();
    if(again){ state.meters[again.id]=mapDevice(again); return again.id; }
    dbError(error, "Registering the device"); return null;
  }
  state.meters[data.id] = mapDevice(data); Store._emit();
  return data.id;
}

async function pruneRegister(){
  const usedM = new Set(), usedS = new Set();
  allIssues().forEach(i=>{ if(i.meterId) usedM.add(i.meterId); if(i.siteId) usedS.add(i.siteId); });
  Object.values(state.meters).forEach(m=>{ if(usedM.has(m.id) && m.siteId) usedS.add(m.siteId); });
  const deadM = Object.values(state.meters).filter(m=>!usedM.has(m.id)).map(m=>m.id);
  const deadS = Object.values(state.sites).filter(s=>!usedS.has(s.id)).map(s=>s.id);
  if(deadM.length){
    const {error} = await sb.from("devices").delete().in("id", deadM);
    if(error) return dbError(error, "Clearing devices"), 0;
    deadM.forEach(id=>delete state.meters[id]);
  }
  if(deadS.length){
    const {error} = await sb.from("sites").delete().in("id", deadS);
    if(!error) deadS.forEach(id=>delete state.sites[id]);
  }
  Store._emit();
  return deadM.length + deadS.length;
}

async function createSession(dateStr){
  const d = dateStr || todayISO();
  const {data, error} = await sb.from("sessions").insert({
    session_date:d, title:"Weekly QA review — "+fmtDateLong(d),
    status:"live", notes:"", created_by:ME.id
  }).select().maybeSingle();
  if(error){ dbError(error, "Starting the review"); return null; }
  const s = mapSession(data);
  state.sessions[s.id] = s;
  ui.sessionId = s.id; ui.sessionTab = "run";
  Store._emit();
  return s;
}
async function updateSession(id, patch){
  const row = {};
  if("status" in patch) row.status = patch.status;
  if("notes"  in patch) row.notes  = patch.notes;
  if("completedAt" in patch) row.completed_at = patch.completedAt ? new Date(patch.completedAt).toISOString() : null;
  const {error} = await sb.from("sessions").update(row).eq("id", id);
  if(error) return dbError(error, "Saving the review");
  state.sessions[id] = Object.assign({}, state.sessions[id], patch);
  Store._emit();
}
async function setOutcome(sessionId, issueId, o){
  const s = state.sessions[sessionId]; if(!s) return;
  const cur = s.outcomes[issueId];
  if(cur && cur.o===o){
    const {error} = await sb.from("session_outcomes").delete()
      .eq("session_id",sessionId).eq("issue_id",issueId);
    if(error) return dbError(error, "Clearing the outcome");
    delete s.outcomes[issueId]; Store._emit();
  } else {
    const {error} = await sb.from("session_outcomes").upsert({
      session_id:sessionId, issue_id:issueId, outcome:o,
      note: cur?cur.note:"", decided_by:ME.id, decided_at:new Date().toISOString()
    }, {onConflict:"session_id,issue_id"});
    if(error) return dbError(error, "Recording the outcome");
    s.outcomes[issueId] = {o, note: cur?cur.note:""}; Store._emit();
  }
  const i = state.issues[issueId]; if(!i) return;
  const now = s.outcomes[issueId] ? s.outcomes[issueId].o : null;
  if(now==="closed" && i.status!=="closed") await setStatus(issueId,"closed");
  if(now!=="closed" && i.status==="closed") await setStatus(issueId,"open");
  if(now==="deferred") await logActivity(issueId, "deferred at "+s.title);
}
async function setOutcomeNote(sessionId, issueId, note){
  const s = state.sessions[sessionId]; if(!s) return;
  const cur = s.outcomes[issueId] || {o:"open", note:""};
  const {error} = await sb.from("session_outcomes").upsert({
    session_id:sessionId, issue_id:issueId, outcome:cur.o, note,
    decided_by:ME.id, decided_at:new Date().toISOString()
  }, {onConflict:"session_id,issue_id"});
  if(error) return dbError(error, "Saving the note");
  s.outcomes[issueId] = {o:cur.o, note}; Store._emit();
}

function weeklyChart(list){
  const weeks = [];
  const start = mondayOf(new Date());
  for(let k=9;k>=0;k--){ const s=addDays(start,-7*k); weeks.push({s:s.getTime(), e:addDays(s,7).getTime(), lab:fmtDate(iso(s))}); }
  const data = weeks.map(w=>({
    lab:w.lab,
    raised:list.filter(i=>i.createdAt>=w.s&&i.createdAt<w.e).length,
    closed:list.filter(i=>i.closedAt&&i.closedAt>=w.s&&i.closedAt<w.e).length
  }));
  const max = Math.max(1, ...data.flatMap(d=>[d.raised,d.closed]));
  const W=560,H=170,PL=30,PB=28,PT=10,PRr=8;
  const iw=W-PL-PRr, ih=H-PT-PB, bw=iw/data.length;
  const ticks=[0,Math.ceil(max/2),max].filter((v,ix,a)=>a.indexOf(v)===ix);
  let g="";
  ticks.forEach(t=>{ const y=PT+ih-(t/max)*ih;
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PRr)+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>'+
       '<text x="'+(PL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Mono, monospace">'+t+'</text>';
  });
  data.forEach((d,ix)=>{
    const x=PL+ix*bw, w=Math.max(4,(bw-10)/2);
    const hr=(d.raised/max)*ih, hc=(d.closed/max)*ih;
    g+='<rect x="'+(x+4)+'" y="'+(PT+ih-hr)+'" width="'+w+'" height="'+Math.max(hr,d.raised?1.5:0)+'" rx="1.5" fill="'+ST.open.color+'"><title>'+d.lab+': '+d.raised+' raised</title></rect>';
    g+='<rect x="'+(x+6+w)+'" y="'+(PT+ih-hc)+'" width="'+w+'" height="'+Math.max(hc,d.closed?1.5:0)+'" rx="1.5" fill="'+ST.closed.color+'"><title>'+d.lab+': '+d.closed+' closed</title></rect>';
    if(ix%2===0) g+='<text x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">'+d.lab+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="auto" role="img" aria-label="Issues raised versus closed over the last ten weeks" style="display:block;max-width:100%">'+g+'</svg>'+
    '<div class="legend"><span><i style="background:'+ST.open.color+'"></i>Raised</span><span><i style="background:'+ST.closed.color+'"></i>Closed</span></div>';
}

function emptyState(title, body, action){
  return '<div class="empty"><h3>'+title+'</h3><p>'+body+'</p>'+(action||"")+'</div>';
}

function wireDnD(){
  let dragId = null;
  $$("#pane-board .kcard").forEach(c=>{
    c.addEventListener("dragstart", e=>{ dragId=c.dataset.card; c.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",dragId);}catch(x){} });
    c.addEventListener("dragend", ()=>{ c.classList.remove("dragging"); dragId=null; $$(".col").forEach(k=>k.classList.remove("over")); });
  });
  $$("#pane-board .col-body").forEach(b=>{
    b.addEventListener("dragover", e=>{ e.preventDefault(); b.closest(".col").classList.add("over"); });
    b.addEventListener("dragleave", ()=>b.closest(".col").classList.remove("over"));
    b.addEventListener("drop", e=>{
      e.preventDefault(); b.closest(".col").classList.remove("over");
      const id = dragId || e.dataTransfer.getData("text/plain");
      if(id && state.issues[id]) setStatus(id, b.dataset.drop);
    });
  });
}

   ============================================================ */
function renderCalendar(){
  if(!ui.calMonth){ const n=new Date(); ui.calMonth=new Date(n.getFullYear(),n.getMonth(),1); }
  const m = ui.calMonth;
  const list = visibleIssues().filter(i=>i.dueDate);
  const byDay = {};
  list.forEach(i=>{ (byDay[i.dueDate]=byDay[i.dueDate]||[]).push(i); });

  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const startCell = mondayOf(first);
  const cells = [];
  for(let k=0;k<42;k++){
    const d = addDays(startCell,k);
    if(k>=35 && d.getMonth()!==m.getMonth()) break;
    cells.push(d);
  }
  const t = todayISO();
  let h = '<div class="toolbar">'+
    '<button class="btn btn-sm" data-cal="-1">&larr;</button>'+
    '<strong style="min-width:150px;text-align:center">'+m.toLocaleDateString("en-IE",{month:"long",year:"numeric"})+'</strong>'+
    '<button class="btn btn-sm" data-cal="1">&rarr;</button>'+
    '<button class="btn btn-sm" data-cal="0">Today</button>'+
    '<span class="hint">'+list.length+' issue'+(list.length===1?"":"s")+' with a due date</span></div>';
  h += '<div class="cal"><div class="cal-dow">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>'<div>'+d+'</div>').join("")+'</div><div class="cal-grid">';
  cells.forEach(d=>{
    const ds = iso(d), out = d.getMonth()!==m.getMonth();
    const evs = (byDay[ds]||[]).sort(sortByPriorityThenAge);
    h += '<div class="cal-cell'+(out?" out":"")+(ds===t?" today":"")+'">'+
      '<span class="cal-d">'+d.getDate()+'</span>'+
      evs.slice(0,3).map(i=>'<button class="cal-ev" data-open="'+i.id+'" style="border-left-color:'+(CAT[i.category]?CAT[i.category].color:"var(--slate)")+'" title="'+esc(i.ref+" · "+i.title+" · "+acctName(i.accountCode))+'">'+esc(i.title)+'</button>').join("")+
      (evs.length>3?'<button class="cal-more" data-cal-day="'+ds+'">+'+(evs.length-3)+' more</button>':"")+
      '</div>';
  });
  h += '</div></div>';
  $("#pane-calendar").innerHTML = h;
}
