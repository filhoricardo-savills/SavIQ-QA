   VIEW · TIMELINE
   ============================================================ */
function renderTimeline(){
  const list = visibleIssues().filter(i=>i.startDate||i.dueDate).sort((a,b)=>{
    const as=parseISO(a.startDate||a.dueDate), bs=parseISO(b.startDate||b.dueDate); return as-bs;
  });
  const start = mondayOf(addDays(new Date(),-14));
  const total = ui.tlWeeks*7;
  const end = addDays(start, total);
  let h = '<div class="toolbar"><div class="seg" role="group" aria-label="Range">'+
    [[8,"8 weeks"],[12,"12 weeks"],[26,"6 months"]].map(([w,n])=>'<button data-tlw="'+w+'" aria-pressed="'+(ui.tlWeeks===w)+'">'+n+'</button>').join("")+
    '</div><span class="hint">Bars run from start date to due date. Issues with neither are not shown.</span></div>';

  if(!list.length){
    $("#pane-timeline").innerHTML = h + emptyState("Nothing scheduled","Give an issue a start or due date and it will appear on the timeline.","");
    return;
  }
  const months = [];
  let cur = new Date(start);
  while(cur < end){
    const mEnd = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const seg = Math.min(mEnd, end);
    months.push({lab:cur.toLocaleDateString("en-IE",{month:"short",year:"2-digit"}), w:daysBetween(cur,seg)/total*100});
    cur = seg;
  }
  const pct = d => Math.max(0, Math.min(100, daysBetween(start, d)/total*100));
  h += '<div class="tl"><div class="tl-scroll"><div class="tl-inner">'+
    '<div class="tl-head"><div class="tl-label">Issue</div><div class="tl-months">'+
      months.map(m=>'<div class="tl-month" style="flex:0 0 '+m.w+'%">'+m.lab+'</div>').join("")+'</div></div>';
  const todayPct = pct(new Date());
  list.forEach(i=>{
    const s = parseISO(i.startDate||i.dueDate);
    const e = parseISO(i.dueDate||i.startDate);
    const a = pct(s), b = Math.max(a+0.7, pct(addDays(e,1)));
    const col = i.status==="closed" ? ST.closed.color : (CAT[i.category]?CAT[i.category].color:"var(--slate)");
    h += '<div class="tl-row"><div class="tl-rlabel">'+
        '<span class="mono" style="font-size:10.5px;color:var(--muted);flex:none">'+i.ref+'</span>'+
        '<button class="t" data-open="'+i.id+'">'+esc(i.title)+'</button></div>'+
      '<div class="tl-track">'+
        '<span class="tl-today" style="left:'+todayPct+'%"></span>'+
        '<button class="tl-bar" data-open="'+i.id+'" style="left:'+a+'%;width:'+(b-a)+'%;background:'+col+';opacity:'+(i.status==="closed"?.45:1)+'" title="'+esc(i.ref+" · "+fmtDateLong(i.startDate)+" → "+fmtDateLong(i.dueDate))+'">'+esc(acctName(i.accountCode))+'</button>'+
      '</div></div>';
  });
  h += '</div></div></div>';
  $("#pane-timeline").innerHTML = h;
}
/* ============================================================
   VIEW · DEVICE HEALTH CHECK
   A lane per SavIQ device. Each bar is one issue, running from the day it
   was raised to the day it was resolved (or to today if it is still open),
   so a device that keeps breaking reads as a row of repeated bars.
   ============================================================ */
const HEALTH = {
  crit:  {name:"Needs attention", cls:"h-crit",  rank:0, color:"var(--crit)"},
  risk:  {name:"Open issue",      cls:"h-risk",  rank:1, color:"var(--info)"},
  watch: {name:"Repeat offender", cls:"h-watch", rank:2, color:"var(--warn)"},
  good:  {name:"Healthy",         cls:"h-good",  rank:3, color:"var(--ok)"}
};

function deviceStats(m, fromTs){
  const issues = allIssues().filter(i=>i.meterId===m.id).sort((a,b)=>a.createdAt-b.createdAt);
  const open = issues.filter(i=>i.status!=="closed");
  const closed = issues.filter(i=>i.status==="closed" && i.closedAt);
  const days = closed.map(i=>Math.max(0, Math.round((i.closedAt-i.createdAt)/86400000)));
  const avg = days.length ? Math.round(days.reduce((a,b)=>a+b,0)/days.length) : null;
  const oldestOpen = open.length ? Math.max(...open.map(ageDays)) : 0;
  const inWindow = issues.filter(i=>i.createdAt>=fromTs || (i.closedAt||Date.now())>=fromTs);
  let health = "good";
  if(open.some(i=>i.priority==="urgent"||i.priority==="high") || oldestOpen>=28) health = "crit";
  else if(open.length) health = "risk";
  else if(inWindow.length>=2) health = "watch";
  return {issues, open, closed, avg, oldestOpen, inWindow, health};
}

function renderDevices(){
  const pane = $("#pane-devices");
  const weeks = ui.dhWeeks || 26;
  const end = new Date(); end.setHours(23,59,59,999);
  const start = mondayOf(addDays(end, -7*weeks));
  const fromTs = start.getTime(), span = end.getTime()-fromTs;

  let devices = Object.values(state.meters);
  if(ui.account) devices = devices.filter(m=>m.accountCode===ui.account);
  if(ui.q){
    const q = ui.q.toLowerCase();
    devices = devices.filter(m=>(m.ref+" "+siteName(m.siteId)+" "+acctName(m.accountCode)).toLowerCase().includes(q));
  }

  const rows = devices.map(m=>Object.assign({m}, deviceStats(m, fromTs)));
  const counts = {crit:0, risk:0, watch:0, good:0};
  rows.forEach(r=>counts[r.health]++);
  const shown = ui.dhHealth ? rows.filter(r=>r.health===ui.dhHealth) : rows;

  let h = '<div class="toolbar">'+
    '<div class="seg" role="group" aria-label="Time range">'+
      [[13,"3 months"],[26,"6 months"],[52,"12 months"]].map(([w,n])=>
        '<button data-dhw="'+w+'" aria-pressed="'+(weeks===w)+'">'+n+'</button>').join("")+'</div>'+
    Object.keys(HEALTH).map(k=>'<button class="chip-filter" data-dhh="'+k+'" aria-pressed="'+(ui.dhHealth===k)+'">'+
      '<span style="width:7px;height:7px;border-radius:50%;background:'+HEALTH[k].color+';display:inline-block"></span>'+
      HEALTH[k].name+' <span class="num">'+counts[k]+'</span></button>').join("")+
    (ui.dhHealth?'<button class="btn btn-sm btn-ghost" data-act="dh-clear">Show all</button>':"")+
    '<span class="topbar-spacer"></span>'+
    '<button class="btn btn-primary btn-sm" data-act="add-devices">'+
      icon('<path d="M12 5v14M5 12h14"/>')+' Register devices</button>'+
    '</div>';

  if(!Object.keys(state.meters).length){
    pane.innerHTML = h + emptyState("No devices registered yet",
      "Register your SavIQ devices and every issue raised against one lands on its lane here, so you can see which devices keep breaking and how long they take to fix. Devices are also added automatically the first time someone types a device key on an issue.",
      '<button class="btn btn-primary" data-act="add-devices">Register devices</button>');
    return;
  }

  const resolved = rows.flatMap(r=>r.closed);
  const avgAll = resolved.length
    ? Math.round(resolved.reduce((a,i)=>a+Math.max(0,(i.closedAt-i.createdAt)/86400000),0)/resolved.length) : null;

  h += '<div class="grid-tiles">'+
    '<div class="tile accent"><span class="v">'+rows.length+'</span><span class="l">Devices registered</span>'+
      '<span class="d">'+(ui.account?esc(acctName(ui.account)):"across all accounts")+'</span></div>'+
    '<div class="tile ok"><span class="v">'+counts.good+'</span><span class="l">Healthy</span><span class="d">no issues in this window</span></div>'+
    '<div class="tile crit"><span class="v">'+(counts.crit+counts.risk)+'</span><span class="l">With an open issue</span>'+
      '<span class="d">'+counts.crit+' need attention</span></div>'+
    '<div class="tile warn"><span class="v">'+counts.watch+'</span><span class="l">Repeat offenders</span><span class="d">fixed, but broke twice</span></div>'+
    '<div class="tile"><span class="v">'+(avgAll===null?"—":avgAll)+'</span><span class="l">Avg days to resolve</span>'+
      '<span class="d">'+resolved.length+' resolved</span></div>'+
    '</div>';

  /* month ruler */
  const months = [];
  let cur = new Date(start.getFullYear(), start.getMonth(), 1);
  if(cur < start) cur = new Date(start);
  while(cur < end){
    const mEnd = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    const segEnd = mEnd < end ? mEnd : end;
    months.push({lab: cur.toLocaleDateString("en-IE",{month:"short"}),
                 w: (segEnd-cur)/span*100,
                 left: (cur-fromTs)/span*100});
    cur = segEnd;
  }
  const pct = ts => Math.max(0, Math.min(100, (ts-fromTs)/span*100));

  h += '<div class="dh"><div class="dh-scroll"><div class="dh-inner">'+
    '<div class="dh-head"><div class="dh-l">Device</div>'+
      '<div class="dh-track" style="height:34px">'+months.map(m=>
        '<span class="dh-month" style="left:'+m.left+'%;width:'+m.w+'%">'+m.lab+'</span>').join("")+'</div>'+
      '<div class="dh-r">Issues · Avg fix</div></div>';

  if(!shown.length){
    h += '<div class="dh-lane"><div style="padding:16px;color:var(--muted);font-size:13px">No devices match that filter.</div></div>';
  }

  groupByAccount(shown.map(r=>({accountCode:r.m.accountCode, _r:r}))).forEach(([code, items])=>{
    h += '<div class="dh-group"><span class="mono" style="font-size:11px;color:var(--muted)">'+code+'</span>'+
         esc(acctName(code))+'<span class="lgroup-n">'+items.length+'</span></div>';
    items.map(x=>x._r).sort((a,b)=>HEALTH[a.health].rank-HEALTH[b.health].rank || b.issues.length-a.issues.length)
      .forEach(r=>{
        const m = r.m;
        h += '<div class="dh-lane">'+
          '<div class="dh-l">'+
            '<span class="dh-key" title="'+esc(m.ref)+'">'+esc(m.ref)+'</span>'+
            '<span class="dh-site">'+esc(siteName(m.siteId)||"No site recorded")+'</span>'+
          '</div>'+
          '<div class="dh-track">'+
            months.map(mo=>'<span class="dh-gl" style="left:'+mo.left+'%"></span>').join("")+
            '<span class="dh-now" style="left:'+pct(Date.now())+'%" title="today"></span>'+
            r.issues.map(i=>{
              const s = i.createdAt, e = (i.status==="closed" && i.closedAt) ? i.closedAt : Date.now();
              if(e < fromTs) return "";
              const a = pct(s), b = Math.max(a+0.6, pct(e));
              const col = i.status==="closed" ? "var(--ok)"
                        : (i.priority==="urgent"||i.priority==="high") ? "var(--crit)"
                        : i.status==="prog" ? "var(--info)" : "var(--warn)";
              const dur = Math.max(0, Math.round((e-s)/86400000));
              const tip = i.ref+" · "+i.title+" · "+(CAT[i.category]||{}).name+
                          " · raised "+fmtDate(iso(new Date(s)))+
                          (i.status==="closed" ? " · resolved "+fmtDate(iso(new Date(e)))+" ("+dur+"d)"
                                               : " · still open ("+dur+"d)");
              return '<button class="dh-bar" data-open="'+i.id+'" style="left:'+a+'%;width:'+(b-a)+'%;background:'+col+'" title="'+esc(tip)+'">'+
                (i.status==="closed"?'<span class="dh-tick">'+icon('<path d="M20 6L9 17l-5-5"/>')+'</span>':"")+'</button>';
            }).join("")+
          '</div>'+
          '<div class="dh-r">'+
            '<span class="pill '+HEALTH[r.health].cls+'" title="'+(r.oldestOpen?("oldest open issue: "+r.oldestOpen+" days"):"")+'">'+HEALTH[r.health].name+'</span>'+
            '<span class="dh-nums"><span class="num">'+r.issues.length+'</span>'+
              '<span class="num" style="color:var(--muted)">'+(r.avg===null?"—":r.avg+"d")+'</span></span>'+
          '</div></div>';
      });
  });

  h += '</div></div>'+
    '<div class="legend" style="padding:10px 12px;border-top:1px solid var(--line);margin:0">'+
      '<span><i style="background:var(--warn)"></i>Open</span>'+
      '<span><i style="background:var(--info)"></i>In progress</span>'+
      '<span><i style="background:var(--crit)"></i>Open, high or urgent</span>'+
      '<span><i style="background:var(--ok)"></i>Resolved — bar ends on the fix</span>'+
      '<span style="color:var(--muted)">Bar length is how long the issue was live.</span>'+
    '</div></div>';
  pane.innerHTML = h;
}

async function saveDevices(){
  const accountCode = $("#adAcct").value;
  if(!accountCode){ toast("Pick the account these devices belong to."); $("#adAcct").focus(); return; }
  const keys = $("#adKeys").value.split(/[\n,;\t]/).map(k=>k.trim()).filter(Boolean);
  if(!keys.length){ toast("Paste at least one device key."); $("#adKeys").focus(); return; }
  const siteId = await resolveSite(accountCode, $("#adSite").value);
  const before = Object.keys(state.meters).length;
  for(const k of keys) await resolveMeter(accountCode, siteId, k);
  const added = Object.keys(state.meters).length - before;
  closeModal();
  toast(added+" device"+(added===1?"":"s")+" registered"+(keys.length-added?" · "+(keys.length-added)+" already known":""));
  setView("devices");
}

function sessionsSorted(){ return Object.values(state.sessions).sort((a,b)=>b.date.localeCompare(a.date)); }
function sessionAgenda(s){
  /* everything still open at the moment the agenda is drawn, plus anything
     already given an outcome in this session (so closed items stay visible) */
  const ids = new Set(Object.keys(s.outcomes||{}));
  return allIssues()
    .filter(i=>i.status!=="closed" || ids.has(i.id))
    .filter(i=>i.createdAt <= new Date(s.date+"T23:59:59").getTime() || ids.has(i.id))
    .sort((a,b)=>{
      const ac=Number(a.accountCode)-Number(b.accountCode);
      return ac || sortByPriorityThenAge(a,b);
    });
}

function renderReview(){
  const pane = $("#pane-review");
  const sessions = sessionsSorted();
  const s = ui.sessionId ? state.sessions[ui.sessionId] : null;

  if(!s){
    const thisMonday = iso(mondayOf(new Date()));
    const haveThisWeek = sessions.some(x=>x.date>=thisMonday);
    let h = '<div class="toolbar">'+
      '<button class="btn btn-primary" data-act="new-session">'+icon('<path d="M12 5v14M5 12h14"/>')+
        (haveThisWeek?"Start another review":"Start this week&rsquo;s review")+'</button>'+
      '<span class="hint">Each review stamps every open issue with an outcome, so carry-over is counted, not remembered.</span></div>';
    if(!sessions.length){
      h += emptyState("No reviews yet",
        "Start a review before your call. The agenda is built from every open issue, grouped by account and ordered by priority and age.",
        '<button class="btn btn-primary" data-act="new-session">Start this week&rsquo;s review</button>');
    } else {
      h += '<div class="sess-list">'+sessions.map(x=>{
        const d = parseISO(x.date);
        const out = Object.values(x.outcomes||{});
        const closed = out.filter(o=>o.o==="closed").length;
        const carried = out.filter(o=>o.o==="open").length;
        const deferred = out.filter(o=>o.o==="deferred").length;
        return '<button class="sess'+(x.status==="live"?" live":"")+'" data-session="'+x.id+'" style="width:100%;text-align:left;cursor:pointer">'+
          '<span class="dt">'+d.toLocaleDateString("en-IE",{month:"short"})+'<b>'+d.getDate()+'</b>'+d.getFullYear()+'</span>'+
          '<span class="body"><span class="t">'+esc(x.title)+'</span>'+
            '<span class="m"><span>'+out.length+' reviewed</span><span style="color:var(--ok)">'+closed+' closed</span>'+
            '<span style="color:var(--warn)">'+carried+' carried</span><span>'+deferred+' deferred</span></span></span>'+
          '<span class="pill '+(x.status==="complete"?"s-closed":"s-prog")+'"><span class="dot"></span>'+(x.status==="complete"?"Complete":"In progress")+'</span>'+
        '</button>';
      }).join("")+'</div>';
    }
    pane.innerHTML = h; return;
  }

  const agenda = sessionAgenda(s);
  let h = '<div class="toolbar">'+
    '<button class="btn btn-sm btn-ghost" data-act="back-sessions">'+icon('<path d="M15 18l-6-6 6-6"/>')+' All reviews</button>'+
    '<strong>'+esc(s.title)+'</strong>'+
    '<div class="seg" role="group" aria-label="Review stage">'+
      [["agenda","Agenda"],["run","Run the call"],["summary","Summary &amp; report"]].map(([v,n])=>
        '<button data-stab="'+v+'" aria-pressed="'+(ui.sessionTab===v)+'">'+n+'</button>').join("")+'</div>'+
    '<span class="topbar-spacer"></span>'+
    (s.status!=="complete"
      ? '<button class="btn btn-primary btn-sm" data-act="complete-session">Mark review complete</button>'
      : '<button class="btn btn-sm" data-act="reopen-session">Reopen review</button>')+
    '</div>';

  if(ui.sessionTab==="agenda")  h += reviewAgendaHTML(s, agenda);
  if(ui.sessionTab==="run")     h += reviewRunHTML(s, agenda);
  if(ui.sessionTab==="summary") h += reviewSummaryHTML(s);
  pane.innerHTML = h;
}

function groupByAccount(list){
  const g = {};
  list.forEach(i=>{ (g[i.accountCode||"none"]=g[i.accountCode||"none"]||[]).push(i); });
  return Object.entries(g).sort((a,b)=>Number(a[0])-Number(b[0]));
}

function reviewSummaryHTML(s){
  const outs = s.outcomes||{};

  const wkStart = new Date(s.date+"T00:00:00"); const prevStart = addDays(wkStart,-7);
  const raised = allIssues().filter(i=>i.createdAt>=prevStart.getTime() && i.createdAt<=new Date(s.date+"T23:59:59").getTime());
  const closed = ids.filter(id=>outs[id].o==="closed");
  const stillOpen = ids.filter(id=>outs[id].o==="open");
  const deferred = ids.filter(id=>outs[id].o==="deferred");

  const acctRows = {};
  ids.forEach(id=>{ const i=state.issues[id]; if(!i) return;
    const a=(acctRows[i.accountCode]=acctRows[i.accountCode]||{closed:0,open:0,deferred:0});
    a[outs[id].o]++; });

  let h = '<div class="grid-tiles">'+
    '<div class="tile accent"><span class="v">'+raised.length+'</span><span class="l">Raised since last review</span></div>'+

    '<div class="tile warn"><span class="v">'+stillOpen.length+'</span><span class="l">Carried to next week</span></div>'+
    '<div class="tile"><span class="v">'+deferred.length+'</span><span class="l">Deferred</span></div>'+
    '</div>';

  h += '<div class="dash-grid">';
  h += '<div class="card"><div class="card-head"><h3>Outcome by account</h3></div><div class="card-body" style="padding:6px 10px 12px">'+
    (Object.keys(acctRows).length ? '<div class="tscroll"><table class="plain" style="min-width:330px"><thead><tr><th>Account</th><th>Closed</th><th>Carried</th><th>Deferred</th></tr></thead><tbody>'+
      Object.entries(acctRows).sort((a,b)=>Number(a[0])-Number(b[0])).map(([code,r])=>
        '<tr><td>'+esc(acctName(code))+' <span class="mono" style="color:var(--muted);font-size:11px">'+code+'</span></td>'+

        '<td class="num">'+r.deferred+'</td></tr>').join("")+'</tbody></table></div>'
      : '<p class="hint" style="padding:8px">No outcomes recorded yet — walk the agenda on the <strong>Run the call</strong> tab.</p>')+
    '</div></div>';

  const carriedList = stillOpen.map(id=>state.issues[id]).filter(Boolean).sort((a,b)=>weeksCarried(b)-weeksCarried(a));
  h += '<div class="card"><div class="card-head"><h3>Longest-running carry-overs</h3></div><div class="card-body" style="padding:6px 10px 12px">'+
    (carriedList.length ? '<div class="tscroll"><table class="plain" style="min-width:420px"><thead><tr><th>Ref</th><th>Issue</th><th>Account</th><th>Owner</th><th>Weeks</th></tr></thead><tbody>'+
      carriedList.slice(0,10).map(i=>'<tr><td class="mono" style="font-size:11px">'+i.ref+'</td>'+
        '<td><button class="t" data-open="'+i.id+'" style="border:0;background:none;padding:0;text-align:left;color:inherit;font-weight:500">'+esc(i.title)+'</button></td>'+
        '<td style="font-size:12px">'+esc(acctName(i.accountCode))+'</td><td style="font-size:12px">'+esc(userName(i.ownerId))+'</td>'+
        '<td class="num"'+(weeksCarried(i)>=3?' style="color:var(--crit);font-weight:600"':"")+'>'+weeksCarried(i)+'</td></tr>').join("")+'</tbody></table></div>'
      : '<p class="hint" style="padding:8px">Nothing carried. Clean week.</p>')+
    '</div></div>';
  h += '</div>';

  h += '<div class="card" style="margin-top:12px"><div class="card-head"><h3>Email summary</h3>'+
    '<div style="margin-left:auto;display:flex;gap:7px">'+
      '<button class="btn btn-sm" data-act="copy-summary">Copy to clipboard</button>'+
      '<button class="btn btn-sm btn-primary" data-act="export-session">Export to Excel</button></div></div>'+
    '<div class="card-body"><pre class="email" id="emailSummary">'+esc(emailSummaryText(s))+'</pre></div></div>';

  h += '<div class="card" style="margin-top:12px"><div class="card-head"><h3>Minutes</h3></div><div class="card-body">'+
    '<textarea class="notes" id="sessNotes" placeholder="Anything discussed that is not tied to a single issue — process changes, data-feed outages, actions for next week.">'+esc(s.notes||"")+'</textarea></div></div>';
  return h;
}

function emailSummaryText(s){
  const outs = s.outcomes||{}; const ids=Object.keys(outs);
  const g = o => ids.map(id=>state.issues[id]).filter(i=>i&&outs[i.id].o===o);
  const closed=g("closed"), open=g("open"), deferred=g("deferred");
  const wkStart = addDays(new Date(s.date+"T00:00:00"),-7).getTime();
  const raised = allIssues().filter(i=>i.createdAt>=wkStart && i.createdAt<=new Date(s.date+"T23:59:59").getTime());
  const line = i => "  "+i.ref+"  "+i.title+"  ["+acctName(i.accountCode)+"] — "+userName(i.ownerId)+
      (outs[i.id]&&outs[i.id].note?"  · "+outs[i.id].note:"")+
      (outs[i.id]&&outs[i.id].o==="open"&&weeksCarried(i)>=1?"  · carried "+weeksCarried(i)+"w":"");
  const L = [];
  L.push(s.title.toUpperCase());
  L.push("=".repeat(Math.min(64, s.title.length)));
  L.push("");
  L.push("Raised since last review: "+raised.length+"   Closed on the call: "+closed.length+
         "   Carried: "+open.length+"   Deferred: "+deferred.length);
  L.push("");
  if(closed.length){ L.push("CLOSED"); closed.forEach(i=>L.push(line(i))); L.push(""); }
  if(open.length){ L.push("CARRIED TO NEXT WEEK"); open.sort((a,b)=>weeksCarried(b)-weeksCarried(a)).forEach(i=>L.push(line(i))); L.push(""); }
  if(deferred.length){ L.push("DEFERRED"); deferred.forEach(i=>L.push(line(i))); L.push(""); }
  if(raised.length){ L.push("RAISED THIS WEEK"); raised.forEach(i=>L.push("  "+i.ref+"  "+i.title+"  ["+acctName(i.accountCode)+"] — "+(CAT[i.category]?CAT[i.category].name:"")+", "+PR[i.priority].name)); L.push(""); }
  if(s.notes){ L.push("NOTES"); s.notes.split("\n").forEach(n=>L.push("  "+n)); L.push(""); }
  L.push("Next review: "+fmtDateLong(iso(addDays(new Date(s.date+"T00:00:00"),7))));
  return L.join("\n");
}

async function drawerField(el){
  const i = state.issues[ui.openIssueId]; if(!i) return;
  const f = el.dataset.f, v = el.value;
  if(f==="siteName"){ const sid = await resolveSite(i.accountCode, v); return updateIssue(i.id,{siteId:sid}, v?("set site to "+v):"cleared the site"); }
  if(f==="meterId"){
    if(v==="__new"){ const box=$("#dwMeterNew"); box.classList.remove("hide"); box.value=""; box.focus(); return; }
    return updateIssue(i.id,{meterId:v||null}, v?("set device key to "+meterRef(v)):"cleared the device key");
  }
  if(f==="tags"){ return updateIssue(i.id,{tags:v.split(",").map(t=>t.trim()).filter(Boolean)},"updated tags"); }
  if(f==="status"){ return setStatus(i.id, v); }
  if(f==="accountCode"){
    const patch = {accountCode:v, siteId:null, meterId:null};
    if(!i.ownerId) patch.ownerId = ownerFor(v);
    return updateIssue(i.id, patch, "moved to account "+acctName(v));
  }
  const labels = {category:"issue type", priority:"priority", ownerId:"owner", reporterId:"reporter",
                  startDate:"start date", dueDate:"due date", recurrence:"recurrence"};
  const shown = (f==="ownerId"||f==="reporterId") ? userName(v) : (f==="category"?(CAT[v]||{}).name : (f==="priority"?PR[v].name : v||"none"));
  return updateIssue(i.id, {[f]: v||null}, "changed "+(labels[f]||f)+" to "+shown);
}

async function saveQuickAdd(again){
  const title = $("#qTitle").value.trim();

  if(!accountCode){ toast("Pick the account the issue sits under."); $("#qAcct").focus(); return; }
  const siteId = await resolveSite(accountCode, $("#qSite").value);
  const pick = $("#qMeter").value;
  const meterId = pick==="__new"
    ? await resolveMeter(accountCode, siteId, $("#qMeterNew").value)
    : (pick || null);
  const issue = await createIssue({
    title, accountCode, siteId, meterId,
    category: $("#qCat").value, priority: $("#qPrio").value,

    ownerId: $("#qOwner").value || ownerFor(accountCode),

function issueRow(i){
  return {
    Ref: i.ref, Issue: i.title,
    "Account code": i.accountCode, Account: acctName(i.accountCode),
    Site: siteName(i.siteId), "SavIQ Device Key": meterRef(i.meterId),
    Type: (CAT[i.category]||{}).name || i.category,
    Priority: (PR[i.priority]||{}).name || i.priority,
    Status: (ST[i.status]||{}).name || i.status,
    Owner: i.ownerId?userName(i.ownerId):"", "Raised by": i.reporterId?userName(i.reporterId):"",
    "Raised on": new Date(i.createdAt).toISOString().slice(0,10),
    "Start date": i.startDate||"", "Due date": i.dueDate||"",
    "Closed on": i.closedAt ? new Date(i.closedAt).toISOString().slice(0,10) : "",
    "Age (days)": ageDays(i), "Weeks carried": i.status==="closed"?0:weeksCarried(i),
    Repeats: (RECURRENCE.find(r=>r.id===i.recurrence)||{}).name||"",
    Tags: (i.tags||[]).join(", "),
    Subtasks: (i.subtasks||[]).length ? (i.subtasks.filter(s=>s.done).length+"/"+i.subtasks.length) : "",
    Comments: (i.comments||[]).length,
    Detail: i.description||""
  };
}
function autoWidth(rows){
  if(!rows.length) return [];
  return Object.keys(rows[0]).map(k=>({wch: Math.min(48, Math.max(k.length+2, ...rows.map(r=>String(r[k]??"").length+2)))}));
}
function addSheet(wb, name, rows){
  const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{"":""}]);
  ws["!cols"] = autoWidth(rows);
  if(rows.length) ws["!autofilter"] = {ref: ws["!ref"]};
  XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
}

function workbookAll(){
  const wb = XLSX.utils.book_new();
  addSheet(wb, "Issues", allIssues().sort((a,b)=>a.ref.localeCompare(b.ref)).map(issueRow));
  addSheet(wb, "Accounts", accountsSorted().map(a=>({
    Code:a.code, Account:a.name, Owner:a.ownerId?userName(a.ownerId):"Unassigned",
    Open: openIssues().filter(i=>i.accountCode===a.code).length,
    Total: allIssues().filter(i=>i.accountCode===a.code).length
  })));
  addSheet(wb, "People", usersSorted().map(u=>({
    Name:u.name, Role:u.role==="admin"?"Administrator":"Member",
    "Accounts owned": accountsSorted().filter(a=>a.ownerId===u.id).map(a=>a.name).join(", "),
    "Open issues owned": openIssues().filter(i=>i.ownerId===u.id).length
  })));
  addSheet(wb, "Device register", Object.values(state.meters).map(m=>({
    "Account code":m.accountCode, Account:acctName(m.accountCode), Site:siteName(m.siteId),
    "SavIQ Device Key":m.ref, Issues: allIssues().filter(i=>i.meterId===m.id).length
  })));
  const rev = [];
  sessionsSorted().forEach(s=>{
    Object.entries(s.outcomes||{}).forEach(([id,o])=>{
      const i = state.issues[id]; if(!i) return;
      rev.push({Review:s.title, "Review date":s.date, Ref:i.ref, Issue:i.title,
        Account:acctName(i.accountCode),
        Outcome:{closed:"Closed", open:"Carried", deferred:"Deferred"}[o.o]||o.o,
        Note:o.note||"", Owner:i.ownerId?userName(i.ownerId):""});
    });
  });
  addSheet(wb, "Review outcomes", rev);
  addSheet(wb, "Comments", allIssues().flatMap(i=>(i.comments||[]).map(c=>({
    Ref:i.ref, Issue:i.title, Author:userName(c.userId),
    When:new Date(c.at).toISOString().slice(0,16).replace("T"," "), Comment:c.text
  }))));
  return wb;
}

function workbookSession(s){
  const wb = XLSX.utils.book_new();
  const outs = s.outcomes||{};
  const rows = Object.keys(outs).map(id=>{
    const i = state.issues[id]; if(!i) return null;
    return Object.assign({Outcome:{closed:"Closed",open:"Carried",deferred:"Deferred"}[outs[id].o],
                          "Minute note":outs[id].note||""}, issueRow(i));
  }).filter(Boolean);
  const counts = {closed:0, open:0, deferred:0};
  Object.values(outs).forEach(o=>counts[o.o]++);
  const wkStart = addDays(new Date(s.date+"T00:00:00"),-7).getTime();
  const raised = allIssues().filter(i=>i.createdAt>=wkStart && i.createdAt<=new Date(s.date+"T23:59:59").getTime());
  addSheet(wb, "Summary", [
    {Metric:"Review", Value:s.title},
    {Metric:"Date", Value:s.date},
    {Metric:"Raised since last review", Value:raised.length},
    {Metric:"Closed on the call", Value:counts.closed},
    {Metric:"Carried to next week", Value:counts.open},
    {Metric:"Deferred", Value:counts.deferred},
    {Metric:"Minutes", Value:s.notes||""}
  ]);
  addSheet(wb, "Outcomes", rows);
  addSheet(wb, "Raised this week", raised.map(issueRow));
  return wb;
}

async function downloadWorkbook(wb, filename){
  let data;
  try{ data = XLSX.write(wb, {bookType:"xlsx", type:"array"}); }
  catch(e){ toast("Could not build the workbook."); return; }
  const blob = new Blob([data], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast("Saved "+filename);
}

function copyText(text, what){
  const done = ()=>toast(what+" copied to the clipboard");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  } else fallback();
  function fallback(){
    const ta=document.createElement("textarea"); ta.value=text;
    ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
    ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Select the text and copy it manually."); }
    ta.remove();
  }
}

function agendaText(s){
  const rows = sessionAgenda(s);
  const L = ["AGENDA — "+s.title, ""];
  groupByAccount(rows).forEach(([code,items])=>{
    L.push(acctName(code)+" ("+code+") — owner: "+userName((state.accounts[code]||{}).ownerId));
    items.forEach(i=>{
      const w = weeksCarried(i);
      L.push("   "+i.ref+"  "+i.title+"  ["+(CAT[i.category]||{}).name+", "+PR[i.priority].name+"]"+
             (w>=1?"  · carried "+w+"w":"  · new")+(locationLine(i)?"  · "+locationLine(i):""));
    });
    L.push("");
  });
  L.push(rows.length+" items · "+groupByAccount(rows).length+" accounts");
  return L.join("\n");
}


/* ============================================================
   JSON BACKUP — a portable copy of everything, off-platform
   ============================================================ */
function saveBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast("Saved "+filename);
}

function exportWorkspace(){
  const snap = {
    format:"meterqa.workspace", schema:2,
    exportedAt:new Date().toISOString(), exportedBy: ME?ME.name:null,
    counts:{ users:Object.keys(state.users).length, accounts:Object.keys(state.accounts).length,
             sites:Object.keys(state.sites).length, devices:Object.keys(state.meters).length,
             issues:Object.keys(state.issues).length, sessions:Object.keys(state.sessions).length },
    data:{ users:state.users, accounts:state.accounts, sites:state.sites,
           devices:state.meters, issues:state.issues, sessions:state.sessions }
  };
  saveBlob(new Blob([JSON.stringify(snap, null, 2)], {type:"application/json"}),
           "meter-qa-backup "+todayISO()+".json");
}
/* ============================================================
   EVENT WIRING
   ============================================================ */
let renderQueued = false;
function isEditing(){
  const a = document.activeElement;
  return a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT") && a.closest("#viewport, #drawer, #modal");
}
function safeRender(){ if(isEditing()){ renderQueued = true; return; } render(); }
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if(renderQueued && !isEditing()){ renderQueued=false; render(); } }, 60); });

document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-view],[data-acct],[data-open],[data-act],[data-tick],[data-collapse],[data-scope],[data-toggle],[data-cat],[data-quick-acct],[data-cal],[data-cal-day],[data-tlw],[data-dhw],[data-dhh],[data-session],[data-stab],[data-outcome],[data-del-user],[data-subtick],[data-subdel],[data-acct-jump],[data-view-jump]");
  if(!t) return;
  const d = t.dataset;

  if(d.view){ setView(d.view); return; }
  if(d.viewJump){ setView(d.viewJump); return; }
  if(d.acct){ ui.account = ui.account===d.acct ? null : d.acct; if(ui.view==="admin"||ui.view==="review") setView("list"); else render(); return; }
  if(d.acctJump){ ui.account = d.acctJump; setView("list"); return; }
  if(d.open){ closeModal(); openIssue(d.open); return; }
  if(d.collapse){ const k=d.collapse; ui.collapsed.has(k)?ui.collapsed.delete(k):ui.collapsed.add(k); render(); return; }
  if(d.scope){ ui.mineOnly = d.scope==="mine"; render(); return; }
  if(d.toggle==="closed"){ ui.showClosed=!ui.showClosed; render(); return; }
  if(d.cat){ ui.cats.has(d.cat)?ui.cats.delete(d.cat):ui.cats.add(d.cat); render(); return; }
  if(d.quickAcct){ quickAddModal(d.quickAcct); return; }
  if(d.tick){ const i=state.issues[d.tick]; if(i) await setStatus(i.id, i.status==="closed"?"open":"closed"); return; }
  if(d.cal!==undefined && d.cal!==""){
    if(d.cal==="0"){ const n=new Date(); ui.calMonth=new Date(n.getFullYear(),n.getMonth(),1); }
    else ui.calMonth = new Date(ui.calMonth.getFullYear(), ui.calMonth.getMonth()+Number(d.cal), 1);
    render(); return;
  }
  if(d.calDay){ dayModal(d.calDay); return; }
  if(d.tlw){ ui.tlWeeks = Number(d.tlw); render(); return; }
  if(d.dhw){ ui.dhWeeks = Number(d.dhw); render(); return; }
  if(d.dhh){ ui.dhHealth = ui.dhHealth===d.dhh ? null : d.dhh; render(); return; }
  if(d.session){ ui.sessionId=d.session; ui.sessionTab= state.sessions[d.session].status==="complete"?"summary":"run"; render(); return; }
  if(d.stab){ ui.sessionTab=d.stab; render(); return; }
  if(d.outcome){ await setOutcome(ui.sessionId, d.outcome, d.o); return; }
  if(d.signin){ setMe(d.signin); closeModal(); render(); return; }
  if(d.delUser){
    const u = state.users[d.delUser]; if(!u) return;
    if(!confirm("Remove "+u.name+" from the workspace? Their issues and comments stay, but any account they own becomes unassigned. If they sign in again they will be added back as a member.")) return;
    await removeUser(u.id); toast(u.name+" removed"); return;
  }
  if(d.subtick||d.subdel){
    const i = state.issues[ui.openIssueId]; if(!i) return;
    let subs = (i.subtasks||[]).slice();
    if(d.subdel) subs = subs.filter(s=>s.id!==d.subdel);
    else subs = subs.map(s=>s.id===d.subtick?Object.assign({},s,{done:!s.done}):s);
    await updateIssue(i.id, {subtasks:subs}); return;
  }

  switch(d.act){
    case "new-issue": quickAddModal(); break;
    case "add-devices": addDevicesModal(); break;
    case "save-devices": await saveDevices(); break;
    case "dh-clear": ui.dhHealth = null; render(); break;
    case "close-modal": closeModal(); break;
    case "save-issue": await saveQuickAdd(!!d.again); break;
    case "close-drawer": closeDrawer(); break;
    case "toggle-close": { const i=state.issues[ui.openIssueId]; if(i) await setStatus(i.id, i.status==="closed"?"open":"closed"); break; }
    case "delete-issue": {
      const i=state.issues[ui.openIssueId]; if(!i) break;
      if(!isAdmin()){ toast("Only an administrator can delete an issue. Close it instead."); break; }
      if(!confirm("Delete "+i.ref+" permanently? This cannot be undone.")) break;
      await deleteIssue(i.id); closeDrawer(); toast(i.ref+" deleted"); break;
    }
    case "add-subtask": {
      const i=state.issues[ui.openIssueId]; if(!i) break;
      await updateIssue(i.id, {subtasks:(i.subtasks||[]).concat([{id:uid("s"), text:"New subtask", done:false}])});
      setTimeout(()=>{ const inputs=$$("#drawer [data-subtext]"); const last=inputs[inputs.length-1]; if(last){ last.focus(); last.select(); } },40);
      break;
    }
    case "add-comment": {
      const box = $("#dwComment"); const txt = box ? box.value.trim() : "";
      if(!txt){ toast("Type a comment first."); break; }
      box.value = "";
      await addComment(ui.openIssueId, txt);
      renderDrawer(); break;
    }
    case "new-session": await createSession(); render(); break;
    case "back-sessions": ui.sessionId=null; render(); break;
    case "complete-session": {
      await updateSession(ui.sessionId, {status:"complete", completedAt:Date.now()});
      ui.sessionTab="summary"; toast("Review closed out"); break;
    }
    case "reopen-session":
      await updateSession(ui.sessionId, {status:"live", completedAt:null}); break;
    case "copy-agenda": copyText(agendaText(state.sessions[ui.sessionId]), "Agenda"); break;
    case "copy-summary": copyText(emailSummaryText(state.sessions[ui.sessionId]), "Summary"); break;
    case "export-session": await downloadWorkbook(workbookSession(state.sessions[ui.sessionId]),
        "QA review "+state.sessions[ui.sessionId].date+".xlsx"); break;
    case "export-all": await downloadWorkbook(workbookAll(), "Meter QA log "+todayISO()+".xlsx"); break;
    case "clear-filters": ui.cats.clear(); ui.q=""; ui.account=null; ui.mineOnly=false; $("#searchInput").value=""; render(); break;
  }
});

document.addEventListener("change", async e=>{
  const el = e.target, d = el.dataset;
  if(d.f && el.closest("#drawer")) return drawerField(el);
  if(d.setStatus) return setStatus(d.setStatus, el.value);
  if(d.setPrio) return updateIssue(d.setPrio, {priority:el.value}, "changed priority to "+PR[el.value].name);
  if(d.userRole) return setUserRole(d.userRole, el.value);
  if(d.acctOwner) return setAccountOwner(d.acctOwner, el.value||null);
  if("myName" in d) return setUserName(ME.id, el.value.trim()||ME.name);
  if(d.onote) return setOutcomeNote(ui.sessionId, d.onote, el.value);
  if(d.subtext){
    const i=state.issues[ui.openIssueId]; if(!i) return;
    return updateIssue(i.id, {subtasks:(i.subtasks||[]).map(s=>s.id===d.subtext?Object.assign({},s,{text:el.value}):s)});
  }
  if(el.id==="qAcct"){
    const sel = $("#qMeter"); if(sel) sel.innerHTML = deviceOptions(el.value, "");
    const box = $("#qMeterNew"); if(box){ box.classList.add("hide"); box.value=""; }
    return;
  }
  if(el.id==="qMeter"){
    const box = $("#qMeterNew"); if(!box) return;
    const add = el.value==="__new";
    box.classList.toggle("hide", !add);
    if(add){ box.value=""; box.focus(); }
    return;
  }
  if(el.id==="groupBy"){ ui.group=el.value; render(); }
  if(el.id==="sessNotes") return updateSession(ui.sessionId, {notes:el.value});
  if(el.id==="dwTitle"||el.id==="dwDesc"){
    const i=state.issues[ui.openIssueId]; if(!i) return;
    const f = el.id==="dwTitle" ? "title" : "description";
    const v = el.value.trim() || (f==="title"?"Untitled issue":"");
    if(v!==i[f]) return updateIssue(i.id, {[f]:v}, f==="title"?"renamed the issue":"updated the description");
  }
});

let searchT;
$("#searchInput").addEventListener("input", e=>{
  clearTimeout(searchT);
  searchT = setTimeout(()=>{ ui.q = e.target.value.trim(); if(ui.q && ui.view==="dashboard") setView("list"); else render(); }, 220);
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if($("#modal").classList.contains("on")) return closeModal();
    if($("#drawer").classList.contains("on")) return closeDrawer();
  }
  if((e.ctrlKey||e.metaKey) && e.key==="Enter" && $("#modal").classList.contains("on") && $("#qTitle")){
    e.preventDefault(); saveQuickAdd(true); return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(typing) return;
  if(e.key==="n"||e.key==="N"){ e.preventDefault(); quickAddModal(); }
  if(e.key==="/"){ e.preventDefault(); $("#searchInput").focus(); }
});

/* "+ Add a new device key" box in the issue drawer */
document.addEventListener("keydown", async e=>{
  if(e.key!=="Enter" || e.target.id!=="dwMeterNew") return;
  e.preventDefault();
  const i = state.issues[ui.openIssueId]; if(!i) return;
  const ref = e.target.value.trim();

  const mid = await resolveMeter(i.accountCode, i.siteId, ref);
  await updateIssue(i.id, {meterId:mid}, "set device key to "+ref);
  toast(ref+" registered");
});

  try{ localStorage.setItem("meterqa.theme", next); }catch(x){}
});
